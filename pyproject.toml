[project]
name = "todo-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniyal Ansari", email = "daniyalad34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "bcrypt>=4.2.0",
    "psycopg2-binary>=2.9.13",
    "pyjwt[crypto]>=2.15.1",
    "openai-agents>=0.24.0,<1",
    "openai-chatkit>=1.6.5,<2",
    "mcp>=2,<3",
]

[project.scripts]
app = "todo_app.api.app:app"
todo-app = "todo_app:main"
todo-app-api = "todo_app.api.app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
