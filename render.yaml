# Render deployment manifest for the FastAPI backend (free web service).
# NOTE: deploy order — Render backend first, then Vercel frontend, then set
# BETTER_AUTH_URL on Render to the Vercel URL and add the Vercel URL to
# CORS_ORIGINS (see README "Deployment").
services:
  - type: web
    name: todo-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn todo_app.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
